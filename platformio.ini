[platformio]
default_envs = core2

[env:core2]
platform = espressif32@6.10.0
board = m5stack-core2
framework = arduino
monitor_speed = 115200
lib_deps =
  https://github.com/m5stack/M5GFX.git#0.2.7
  https://github.com/m5stack/M5Unified.git#0.2.5
  https://github.com/bblanchon/ArduinoJson.git#v7.3.1
build_flags = -Wall -Wextra
